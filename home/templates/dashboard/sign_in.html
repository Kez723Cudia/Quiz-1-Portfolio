<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Sign In - Engr. Kezia Yuriese Cudia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-color: #111;
            color: #f8f9fa;
            font-family: Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign-in-container {
            width: 100%;
            max-width: 470px;
            padding: 2.5rem;
            background-color: rgba(173, 216, 230, 0.08);
            border: 1px solid #127cd6;
            border-radius: 0.75rem;
            animation: fadeInUp 0.8s ease-in-out;
        }

        .sign-in-container h1 {
            margin-bottom: 0.5rem;
            color: #4da3ff;
            font-size: 2.3rem;
            font-weight: 800;
        }

        .sign-in-description {
            margin-bottom: 2rem;
            color: rgba(248, 249, 250, 0.75);
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            background-color: rgba(173, 216, 230, 0.1);
            border: 1px solid royalblue;
            color: #f8f9fa;
        }

        .form-control:focus {
            background-color: rgba(173, 216, 230, 0.18);
            border-color: #4da3ff;
            box-shadow: 0 0 0 0.2rem rgba(77, 163, 255, 0.15);
            color: #f8f9fa;
        }

        .btn-sign-in {
            width: 100%;
            background-color: #198754;
            border-color: #198754;
            color: #fff;
            font-weight: 700;
            transition: background-color 0.3s ease;
        }

        .btn-sign-in:hover {
            background-color: #157347;
            border-color: #146c43;
            color: #fff;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #4da3ff;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f8f9fa;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="sign-in-container">
        <h1>Owner Sign In</h1>

        <p class="sign-in-description">
            This dashboard is restricted to the portfolio owner.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div
                    class="alert
                    {% if message.tags == 'error' %}
                        alert-danger
                    {% else %}
                        alert-{{ message.tags }}
                    {% endif %}
                    alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    autocomplete="username"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-sign-in">
                Sign In
            </button>
        </form>

        <a href="{% url 'home' %}" class="back-link">
            &lt; Back to portfolio
        </a>
    </main>

    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
