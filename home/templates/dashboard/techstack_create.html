<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Tech Stack</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body{
            background:#111;
            color:#f8f9fa;
            font-family:Helvetica,Arial,sans-serif;
        }

        .container{
            padding:5rem 4rem;
        }

        h1{
            color:#4da3ff;
            font-weight:800;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Create Tech Stack</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">
            Create Tech Stack
        </button>
    </form>

    <br>

    <a href="{% url 'dashboard_home' %}" class="btn btn-secondary">
        Back to Dashboard
    </a>
</div>

</body>
</html>
