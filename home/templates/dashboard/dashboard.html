<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Engr. Kezia Yuriese Cudia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background-color: #111;
            color: #f8f9fa;
            font-family: Helvetica, Arial, sans-serif;
        }

        .dashboard-container {
            padding: 5rem 4rem;
        }

        h1 {
            color: #4da3ff;
            font-size: 3.5rem;
            font-weight: 800;
        }

        .dashboard-card {
            margin-top: 2rem;
            padding: 2rem;
            background-color: rgba(173, 216, 230, 0.08);
            border-left: 4px solid #4da3ff;
            border-radius: 0.5rem;
        }

        .btn-logout {
            background-color: #dc3545;
            border-color: #dc3545;
            color: #fff;
            font-weight: 600;
        }

        .btn-logout:hover {
            background-color: #bb2d3b;
            border-color: #b02a37;
            color: #fff;
        }
    </style>
</head>

<body>
    <main class="dashboard-container container">
        <h1>Owner Dashboard</h1>

        <div class="dashboard-card">
            <h2>Welcome, {{ request.user.username }}</h2>

            <p>
                Authentication was successful. The Projects and Tech Stacks
                management tables will be added here next.
            </p>

            <form
                method="post" 
                action="{% url 'dashboard_logout' %}">
                {% csrf_token %}

                <button type="submit" class="btn btn-logout">
                    Log Out
                </button>
            </form>
        </div>
    </main>
</body>
</html>
