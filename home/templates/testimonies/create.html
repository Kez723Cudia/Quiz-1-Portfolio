<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Share Your Testimony - Engr. Kezia Yuriese Cudia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            font-family: Helvetica, Arial, sans-serif;
            color: #f8f9fa;
        }
        .testimonies-container {
            padding: 5rem 4rem;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .testimonies-container h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: navy;
            margin-bottom: 2rem;
        }
        .form-control {
            background-color: rgba(173, 216, 230, 0.1);
            border: 1px solid royalblue;
            color: #f8f9fa;
        }
        .form-control:focus {
            background-color: rgba(173, 216, 230, 0.2);
            border-color: royalblue;
            box-shadow: none;
            color: #f8f9fa;
        }
        .btn-submit {
            background-color: #2ba728;
            color: #fff;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #fff;
            color: #000000;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tracker-navbar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 3rem;
        }
        .tracker-link {
            font-size: 1rem;
            font-weight: 600;
            color: #127CD6;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .tracker-link:hover {
            color: #0072C6; 
            transform: translateX(5px);
        }
        .tracker-active {
            color: #0072C6;
            border-bottom: 2px solid #0072C6;
            padding-bottom: 2px;
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 600;
            color: royalblue;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .nav-link:hover {
            color: #f8f9fa;
            transform: translateX(5px);
        }
        .nav-left {
            float: left;
        }
        .nav-right {
            float: right;
        }
    </style>
</head>
<body>
    <div class="testimonies-container container">
        <h1>Share Your Testimony</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                {{ form.full_name.label_tag }}
                {{ form.full_name }}
            </div>
            <div class="mb-3">
                {{ form.content.label_tag }}
                {{ form.content }}
            </div>
            <button type="submit" class="btn btn-submit">
                <i class="bi bi-send-fill"></i> Submit
            </button>
        </form>

        <!-- Navigation links -->
        <a href="{% url 'testimony_list' %}" class="nav-link nav-left">< Back to list</a>


        <!-- Tracker Navbar -->
        <nav class="tracker-navbar">
            <a href="{% url 'home' %}" class="tracker-link">Hero</a>
            <a href="{% url 'about' %}" class="tracker-link">About</a>
            <a href="{% url 'skills' %}" class="tracker-link">Skills</a>
            <a href="{% url 'project_list' %}" class="tracker-link">Projects</a>
            <a href="{% url 'contact' %}" class="tracker-link">Contact</a>
            <a href="{% url 'personal_info' %}" class="tracker-link">Personal Info</a>
            <a href="{% url 'testimony_list' %}" class="tracker-link tracker-active">Testimonies</a>
        </nav>
    </div>
</body>
</html>
