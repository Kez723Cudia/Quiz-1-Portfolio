<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ testimony.full_name }} - Testimony</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            font-family: Helvetica, Arial, sans-serif;
            color: #f8f9fa;
        }
        .testimony-detail {
            padding: 5rem 4rem;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .testimony-detail h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: navy;
            margin-bottom: 1.5rem;
        }
        .testimony-content {
            background-color: rgba(173, 216, 230, 0.1);
            border: 1px solid royalblue;
            padding: 1.5rem;
            border-radius: 0.5rem;
            white-space: pre-line; /* preserves line breaks */
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 600;
            color: royalblue;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .nav-link:hover {
            color: #f8f9fa;
            transform: translateX(5px);
        }
    </style>
</head>
<body>
    <div class="testimony-detail container">
        <h1>{{ testimony.full_name }}</h1>
        <div class="testimony-content">
            {{ testimony.content|linebreaks }}
        </div>

        <!-- Navigation link back to list -->
        <div class="mt-4">
            <a href="{% url 'testimony_list' %}" class="nav-link">< Back to Testimonies</a>
        </div>
    </div>
</body>
</html>
