<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Testimonies - Engr. Kezia Yuriese Cudia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            font-family: Helvetica, Arial, sans-serif;
            color: #f8f9fa;
        }
        .testimonies-container {
            padding: 5rem 4rem;
            animation: fadeInUp 1.5s ease-in-out;
        }
        .testimonies-container h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: navy;
            margin-bottom: 2rem;
        }
        .list-group-item {
            background-color: rgba(173, 216, 230, 0.1);
            border: 1px solid royalblue;
            color: #f8f9fa;
        }
        .list-group-item strong {
            color: royalblue;
        }
        .btn-submit {
            background-color: #48d3a1;
            color: #000000;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #fff;
            color: #48d3a1;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tracker-navbar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 3rem;
        }
        .tracker-link {
            font-size: 1rem;
            font-weight: 600;
            color: #127CD6; /* Outlook blue */
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .tracker-link:hover {
            color: #0072C6; /* Spanish blue */
            transform: translateX(5px);
        }
        .tracker-active {
            color: #0072C6;
            border-bottom: 2px solid #0072C6;
            padding-bottom: 2px;
        }
        .nav-link {
            font-size: 1rem;
            font-weight: 600;
            color: royalblue;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }
        .nav-link:hover {
            color: #f8f9fa;
            transform: translateX(5px);
        }
        .nav-left {
            float: left;
        }
        .nav-right {
            float: right;
        }
    </style>
</head>
<body>
    <div class="testimonies-container container">
        <h1>What People Say</h1>
        <ul class="list-group">
            {% for testimony in testimonies %}
                <li class="list-group-item">
                    <strong>
                        <a href="{% url 'testimony_detail' testimony.pk %}" class="nav-link">
                            {{ testimony.full_name }}
                        </a>
                    </strong><br>
                    {{ testimony.content|truncatewords:20 }}
                </li>
            {% empty %}
                <li class="list-group-item">No testimonies yet.</li>
            {% endfor %}
        </ul>

        <!-- Button to create a testimony -->
        <div class="mt-4">
            <a href="{% url 'testimony_create' %}" class="btn btn-submit">Share your testimony</a>
        </div>

        <!-- Navigation links -->
        <div class="mt-3">
            <a href="{% url 'personal_info' %}" class="nav-link nav-left">< Previous</a>
        </div>

        <!-- Tracker Navbar -->
        <nav class="tracker-navbar">
            <a href="{% url 'home' %}" class="tracker-link">Hero</a>
            <a href="{% url 'about' %}" class="tracker-link">About</a>
            <a href="{% url 'skills' %}" class="tracker-link">Skills</a>
            <a href="{% url 'project_list' %}" class="tracker-link">Projects</a>
            <a href="{% url 'contact' %}" class="tracker-link">Contact</a>
            <a href="{% url 'personal_info' %}" class="tracker-link">Personal Info</a>
            <a href="{% url 'testimony_list' %}" class="tracker-link tracker-active">Testimonies</a>
        </nav>
    </div>
</body>
</html>
